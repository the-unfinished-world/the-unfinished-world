<!doctype html><html><head><meta charset="utf-8"><title>bridge test</title>
<style>body{margin:0;background:#f1ede4}canvas{display:block}</style></head><body>
<canvas id="c" width="1440" height="1700"></canvas>
<script src="ink.js"></script><script src="bridges.js"></script>
<script>
const ctx=document.getElementById('c').getContext('2d'); const INK='#1d1b18';
const { rock, fadeBase, rng } = Ink;
function ledgeBlock(x, y, dir, w){ const pts=[[x,y],[x-dir*w,y-14],[x-dir*w-20,y+40],[x-dir*w-10,y+150],[x-dir*30,y+165],[x+dir*6,y+60]]; rock(ctx, pts, {seed:Math.round(x+y), amp:4, round:2, base:.2, pool:.3, lip:.14, poolEdge:.14, cun:60, cunLen:40, lineWidth:3}); }
const rows=[['rope',60],['truss',420],['pier',780],['cantilever',1360]];
rows.forEach(([type,y0],i)=>{
  const P0={x:420,y:y0+160}, P2={x:760,y:y0};             // left ledge lower, right ledge higher (as in the scene)
  ctx.save(); ledgeBlock(P0.x+44,P0.y+7,1,300); ledgeBlock(P2.x,P2.y,-1,300); ctx.restore();
  const B=Bridges.make({k:i,P0,P2,landing:{x:P2.x+60,y:P2.y-3},type,seed:i*977+5,DECK_W:110,INK});
  for(const pn of B.pinnacles){ const w0=pn.w/2,w1=w0+40; const pts=[[pn.x-w0,pn.yTop],[pn.x-w0*.5,pn.yTop-1],[pn.x,pn.yTop-1],[pn.x+w0*.5,pn.yTop-1],[pn.x+w0,pn.yTop],[pn.x+w0+6,pn.yTop+40],[pn.x+w1,pn.yTop+300],[pn.x-w1,pn.yTop+300],[pn.x-w0-8,pn.yTop+50]]; rock(ctx,pts,{seed:pn.seed,amp:4,round:2,base:.2,pool:.3,lip:.1,poolEdge:.14,cun:40,cunLen:40,lineWidth:2.6}); }
  for(const sl of B.slots){ Bridges.place(ctx, sl, sl.x, sl.y, sl.rot, sl.a||1); }
  ctx.fillStyle='#8a857a'; ctx.font='13px system-ui'; ctx.fillText(type.toUpperCase(), 60, y0+90);
});
// mist veil over the lower part of each row so bases dissolve like the scene
rows.forEach(([t,y0])=>{ const g=ctx.createLinearGradient(0,y0+230,0,y0+300); g.addColorStop(0,'rgba(241,237,228,0)'); g.addColorStop(1,'rgba(241,237,228,1)'); ctx.fillStyle=g; ctx.fillRect(0,y0+230,1440,70); });
</script></body></html>
